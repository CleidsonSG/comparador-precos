<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gôndola — comparador de preços de supermercado (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f5; --surface:#ffffff; --ink:#0f1b2d; --ink2:#4a586f; --line:#dbe1ea; --soft:#f4f6f9;
  --tag:#ffc93c; --tag-ink:#1a1400;
  --good:#0b7a50; --good-bg:#e1f4ec; --bad:#c43a31; --bad-bg:#fbe8e6; --warn-bg:#fff3d1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --focus:#2a78d6; --shadow:0 1px 2px rgba(15,27,45,.06),0 6px 20px rgba(15,27,45,.05);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0e141b; --surface:#17202b; --ink:#eaf0f7; --ink2:#aab6c8; --line:#2a3646; --soft:#1d2836;
    --good:#2fbf86; --good-bg:#12352a; --bad:#ff7b72; --bad-bg:#3a1f1d; --warn-bg:#3a3012;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --focus:#6da7ec; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e141b; --surface:#17202b; --ink:#eaf0f7; --ink2:#aab6c8; --line:#2a3646; --soft:#1d2836;
  --good:#2fbf86; --good-bg:#12352a; --bad:#ff7b72; --bad-bg:#3a1f1d; --warn-bg:#3a3012;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --focus:#6da7ec; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.app{min-height:100vh;display:flex;flex-direction:column}
.side{display:none}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font-size:22px;line-height:1.2;margin:0;flex:1}
.iconbtn{min-width:44px;min-height:44px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer}
.iconbtn:hover{background:var(--soft)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border-radius:12px;color:var(--ink2);text-decoration:none;font-size:12px;font-weight:600;position:relative}
.nav svg{width:22px;height:22px}
.nav[aria-current="page"]{color:var(--ink);background:var(--soft)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--tag);color:var(--tag-ink);font-size:11px;display:grid;place-items:center;padding:0 5px}
@media(min-width:900px){
  .app{flex-direction:row}
  .side{display:flex;flex-direction:column;gap:6px;width:236px;padding:20px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface)}
  .bottom{display:none}
  main{padding:28px 32px 48px}
  .side .nav{flex-direction:row;gap:12px;justify-content:flex-start;padding:0 14px;font-size:15px;min-height:46px}
  .side .nav .dot{position:static;margin-left:auto}
}
.brand{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;letter-spacing:.2px;padding:0 8px 14px}
.brand i{width:30px;height:22px;background:var(--tag);border-radius:5px 5px 5px 11px;display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--surface)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:14px;margin:0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1.5fr 1fr}.cols2{grid-template-columns:1fr 1fr}}
.kpi .v{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:40px;line-height:1.05;margin:6px 0 4px}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px}
.delta.good{background:var(--good-bg);color:var(--good)} .delta.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12px;color:var(--ink2)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--warn-bg);margin-bottom:14px;font-size:14px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.tag{background:var(--tag);color:var(--tag-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{fill:var(--ink2);font-size:12px}
.tip{position:absolute;left:0;right:0;top:0;pointer-events:none;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:13px;padding:2px 4px}
.tip>b{font-size:14px}
.tip span.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 0;font-size:13px;color:var(--ink2)}
.legend .sw{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
.bars{display:grid;gap:12px;margin-top:10px}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.bar .track{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0;transition:width .5s}

/* scanner */
.scanner{position:relative;aspect-ratio:4/3;max-height:300px;width:100%;border-radius:18px;background:#0b1118;overflow:hidden;display:grid;place-items:center;color:#c9d3e0}
.scanner .corner{position:absolute;width:38px;height:38px;border:4px solid var(--tag)}
.scanner .c1{left:14%;top:16%;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.scanner .c2{right:14%;top:16%;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.scanner .c3{left:14%;bottom:16%;border-right:0;border-top:0;border-radius:0 0 0 10px}
.scanner .c4{right:14%;bottom:16%;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scanner .line{position:absolute;left:16%;right:16%;height:2px;background:var(--tag);box-shadow:0 0 12px var(--tag);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:22%}50%{top:76%}}
.scanner p{margin:0;font-size:14px;text-align:center;padding:0 24px;z-index:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip:hover{background:var(--soft)} .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* price tag — o elemento memorável */
.pricetag{background:var(--tag);color:var(--tag-ink);border-radius:14px 14px 14px 30px;padding:16px 18px 16px 44px;position:relative;box-shadow:0 8px 22px rgba(255,201,60,.25)}
.pricetag:before{content:"";position:absolute;left:16px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.pricetag .pn{font-weight:700;font-size:15px}
.pricetag .pv{margin-top:10px;display:flex;align-items:baseline;gap:6px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1}
.pricetag .pv small{font-size:22px}
.pricetag input{width:100%;max-width:200px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:56px;line-height:1;background:transparent;border:0;border-bottom:3px solid var(--tag-ink);color:var(--tag-ink);padding:0;border-radius:0}
.pricetag input:focus-visible{outline:3px solid var(--tag-ink);outline-offset:4px}
.verdict{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600}
.verdict.good{background:var(--good-bg);color:var(--good)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict svg{flex:none;width:22px;height:22px;margin-top:1px}
.verdict.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.mk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mk:last-child{border:0}
.mk .p{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;text-align:right}
.mk.best .p{color:var(--good)}
.mk>b{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{white-space:nowrap}
.mk .d{font-size:13px;color:var(--ink2)}

/* forms */
.field{display:grid;gap:6px;margin:10px 0}
.field input,.field select{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
.field label{font-size:14px;font-weight:600}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{display:grid;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.opt:hover{background:var(--soft)} .opt svg{width:26px;height:26px}
.opt b{font-size:15px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--ink2)}
.drop.over{border-color:var(--focus);background:var(--soft)}
.list{display:grid}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border:0}
.empty{text-align:center;padding:28px 12px;color:var(--ink2)}
.empty svg{width:44px;height:44px;margin-bottom:6px}
.empty h3{margin:0 0 4px;color:var(--ink);font-size:17px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--good)} .switch input:checked+i:after{transform:translateX(22px)}
.switch input:focus-visible+i{outline:3px solid var(--focus);outline-offset:2px}
.set{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
dialog{border:0;border-radius:18px;padding:22px;max-width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,12,18,.55)}
dialog h2{margin:0 0 8px;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:50;max-width:calc(100vw - 32px);font-size:14px;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- navegação ---------- */
var NAV=[["inicio","Início","home"],["escanear","Escanear","scan"],["carrinho","Carrinho","cart"],["notas","Notas","doc"]];
var TITLES={inicio:"Início",escanear:"Escanear produto",carrinho:"Carrinho",notas:"Notas fiscais",ajustes:"Configurações"};
function navHtml(){
  return NAV.map(function(n){
    var dot=(n[0]==="carrinho"&&S.cart.length)?'<span class="dot">'+S.cart.length+'</span>':"";
    return '<a class="nav" href="#'+n[0]+'"'+(S.view===n[0]?' aria-current="page"':"")+'>'+I[n[2]]+'<span>'+n[1]+'</span>'+dot+'</a>';
  }).join("");
}
function route(){
  var h=(location.hash||"#inicio").slice(1);
  S.view=TITLES[h]?h:"inicio"; render(); window.scrollTo(0,0);
}

/* ---------- gráficos ---------- */
function lineChartSvg(W){
  var H=290,l=46,r=W<520?96:104,t=56,b=30,n=MONTHS.length,keys=["m1","m2","m3"],col={m1:"var(--s1)",m2:"var(--s2)",m3:"var(--s3)"};
  var all=[];keys.forEach(function(k){all=all.concat(HIST[k])});
  var lo=Math.floor(Math.min.apply(null,all)-1),hi=Math.ceil(Math.max.apply(null,all)+1);
  var X=function(i){return l+i*(W-l-r)/(n-1)},Y=function(v){return t+(hi-v)*(H-t-b)/(hi-lo)};
  S.geo={W:W,H:H,l:l,r:r,t:t,b:b,X:X,Y:Y,keys:keys,col:col};
  var g="";
  for(var v=lo;v<=hi;v+=2){g+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="num">'+v+'</text>'}
  var xl=MONTHS.map(function(m,i){return '<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+m+'</text>'}).join("");
  var paths=keys.map(function(k){return '<path d="'+HIST[k].map(function(v,i){return(i?"L":"M")+X(i)+" "+Y(v)}).join(" ")+'" fill="none" stroke="'+col[k]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'}).join("");
  var ends=keys.map(function(k){return{k:k,y:Y(HIST[k][n-1])}}).sort(function(a,b){return a.y-b.y});
  for(var i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<16)ends[i].y=ends[i-1].y+16}
  var labels=ends.map(function(e){var m=M.filter(function(x){return x.id===e.k})[0];return '<text x="'+(W-r+10)+'" y="'+(e.y+4)+'" style="fill:var(--ink);font-weight:600">'+m.short+' '+HIST[e.k][n-1].toFixed(2).replace(".",",")+'</text>'}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Preço do arroz branco 5 kg por mês em três mercados, de junho a novembro. Use as setas para ver cada mês." tabindex="0" id="lc">'+g+xl+paths+labels+'<g id="cross"></g><rect x="'+l+'" y="'+t+'" width="'+(W-l-r)+'" height="'+(H-t-b)+'" fill="transparent" id="lcHit"/></svg>';
}
function tipHtml(){
  var i=S.chartIdx;
  return '<b>'+MONTHS[i]+'</b>'+["m1","m2","m3"].map(function(k){var c={m1:"var(--s1)",m2:"var(--s2)",m3:"var(--s3)"}[k];return '<span><span class="sw" style="background:'+c+'"></span>'+M.filter(function(m){return m.id===k})[0].short+' <b class="num">'+money(HIST[k][i])+'</b></span>'}).join("");
}
function tableChart(){
  return '<table><thead><tr><th>Mês</th>'+M.map(function(m){return '<th class="r">'+m.short+'</th>'}).join("")+'</tr></thead><tbody>'+MONTHS.map(function(mo,i){return '<tr><td>'+mo+'</td>'+["m1","m2","m3"].map(function(k){return '<td class="r num">'+money(HIST[k][i])+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table>';
}
function basket(){
  return M.map(function(m){var t=0;P.forEach(function(p){t+=p.pr[m.id][0]});return{id:m.id,name:m.name,total:t}}).sort(function(a,b){return a.total-b.total});
}

/* ---------- telas ---------- */
function vInicio(){
  if(S.loading){
    return '<div class="grid kpis">'+[1,2,3].map(function(){return '<div class="card"><div class="skel" style="height:14px;width:55%"></div><div class="skel" style="height:40px;width:70%;margin:12px 0"></div><div class="skel" style="height:22px;width:40%"></div></div>'}).join("")+'</div><div class="card" style="margin-top:14px"><div class="skel" style="height:250px"></div></div>';
  }
  if(S.error){
    return '<div class="card empty" role="alert">'+I.alert+'<h3>Não foi possível carregar seus dados</h3><p>Verifique a conexão e tente de novo. Seu histórico guardado no aparelho continua disponível.</p><button class="btn primary" data-a="retry">Tentar de novo</button></div>';
  }
  var bs=basket(),max=bs[bs.length-1].total,save=0;
  P.forEach(function(p){save+=p.pr.m1[0]-minOf(p).v});
  var kp=
   '<div class="card kpi"><p class="sub">Gasto em novembro</p><div class="v num">R$ 842,36</div><span class="delta good">'+I.down+' 4,1% menos que outubro</span></div>'+
   '<div class="card kpi"><p class="sub">Sua inflação em 6 meses</p><div class="v num">+10,4%</div><span class="delta bad">'+I.up+' acima da faixa de 2025</span></div>'+
   '<div class="card kpi"><p class="sub">Economia possível na última compra</p><div class="v num">'+money(save)+'</div><span class="delta good">'+I.down+' comprando no mais barato</span></div>';
  var bars=bs.map(function(b,i){return '<div class="bar"><div class="lab"><span>'+b.name+(i===0?' <span class="pill good">'+I.down.replace('width="14" height="14"','width="12" height="12" style="vertical-align:-1px"')+' mais barato</span>':'')+'</span><b class="num">'+money(b.total)+'</b></div><div class="track"><div class="fill" style="width:'+(b.total/max*100)+'%"></div></div></div>'}).join("");
  var rises=RISES.map(function(r){return '<div class="item"><span>'+r[0]+'</span><span class="delta bad">'+I.up+' '+String(r[1]).replace(".",",")+'%</span></div>'}).join("");
  return '<p class="note" style="margin:-6px 0 12px">Dados de exemplo: mercados e preços fictícios.</p><div class="grid kpis">'+kp+'</div>'+
  '<div class="grid two" style="margin-top:14px"><div class="card"><div class="row" style="justify-content:space-between"><div><h2>Arroz branco 5 kg: preço por mês</h2><p class="sub">Toque ou passe o mouse no gráfico</p></div><button class="btn sm" data-a="tbl" aria-pressed="'+S.showTable+'">'+(S.showTable?"Ver gráfico":"Ver tabela")+'</button></div>'+
  (S.showTable?'<div style="margin-top:8px">'+tableChart()+'</div>':'<div class="chart" id="chartBox" style="min-height:290px"></div><div class="legend" aria-hidden="false">'+M.map(function(m,i){return '<span><i class="sw" style="background:var(--s'+(i+1)+')"></i>'+m.name+'</span>'}).join("")+'</div>')+
  '</div><div class="card"><h2>Cesta de 6 itens por mercado</h2><p class="sub">Soma dos últimos preços que você pagou</p><div class="bars">'+bars+'</div></div></div>'+
  '<div class="card" style="margin-top:14px"><h2>Maiores aumentos desde junho</h2><div class="list">'+rises+'</div></div>';
}
function cmpCard(p){
  var rows=Object.keys(p.pr).map(function(k){return{k:k,v:p.pr[k][0],d:p.pr[k][1]}}).sort(function(a,b){return a.v-b.v});
  var h=rows.map(function(r,i){return '<div class="mk'+(i===0?" best":"")+'"><b>'+mname(r.k)+(i===0?' <span class="pill good">mais barato</span>':'')+'</b><span class="p num">'+money(r.v)+'</span><span class="d">Última compra em '+dm(r.d)+'</span><span></span></div>'}).join("");
  return '<h2>Onde você já comprou</h2>'+h;
}
function verdict(p,val){
  var mn=minOf(p),num=parseFloat(String(val).replace(",","."));
  if(!isFinite(num)||num<=0)return "";
  var diff=num-mn.v,pct=diff/mn.v*100;
  if(diff<=0.004)return '<div class="verdict good pop" role="status">'+I.ok+'<div>Melhor preço que você já pagou neste produto.<br><span style="font-weight:500">Antes: '+money(mn.v)+' no '+mname(mn.m)+'.</span></div></div>';
  return '<div class="verdict bad pop" role="status">'+I.alert+'<div>'+money(diff)+' mais caro ('+pct.toFixed(1).replace(".",",")+'%) que no '+mname(mn.m)+'.<br><span style="font-weight:500">Pago em '+dm(mn.d)+': '+money(mn.v)+'.</span></div></div>';
}
function vEscanear(){
  var p=S.sel?pid(S.sel):null;
  var chips=P.map(function(x){return '<button class="chip" data-a="pick" data-id="'+x.id+'" aria-pressed="'+(S.sel===x.id)+'">'+x.name+'</button>'}).join("");
  var left='<div class="card"><div class="scanner" aria-label="Área da câmera (simulada)"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>'+(p?'':'<span class="line"></span>')+'<p>'+(p?'<b>Código lido</b><br><span class="num">'+p.gtin+'</span>':'Aponte para o código de barras do produto')+'</p></div>'+
   '<p class="note" style="margin:10px 0 0">No protótipo a câmera é simulada. Escolha um produto para ver a leitura:</p><div class="chips">'+chips+'</div>'+
   '<div class="field" style="margin-top:14px"><label for="here">Você está em</label><select id="here">'+M.map(function(m){return '<option value="'+m.id+'"'+(S.here===m.id?" selected":"")+'>'+m.name+'</option>'}).join("")+'</select></div></div>';
  var right;
  if(!p){right='<div class="card empty">'+I.scan+'<h3>Escaneie um produto</h3><p>O preço de cada mercado onde você já comprou aparece aqui, antes de pôr no carrinho.</p></div>'}
  else{
    var adv="";
    if(S.ocr.status==="unset")adv='<button class="btn sm" data-a="advTry">Leitura avançada (opcional)</button>';
    if(S.ocr.status==="accepted")adv='<button class="btn sm" data-a="advRead">Leitura avançada</button>';
    right='<div class="pricetag"><div class="pn">'+p.name+'</div><div class="pv"><small>R$</small><input id="shelf" inputmode="decimal" aria-label="Preço na prateleira hoje" placeholder="0,00" value="'+S.shelf+'"></div><div style="font-size:13px;margin-top:6px">Preço na prateleira hoje</div></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn sm" data-a="readA">Ler etiqueta (no aparelho)</button>'+adv+'</div>'+
    (S.read?'<div class="verdict" style="background:var(--soft);font-weight:500" role="status"><span>Valor lido: <b class="num">'+S.read.v+'</b> ('+S.read.how+'). Confirme ou corrija no campo acima.</span></div>':'')+
    '<div id="vd">'+verdict(p,S.shelf)+'</div>'+
    '<div class="card" style="margin-top:12px">'+cmpCard(p)+'</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn tag" data-a="add" style="flex:1">Adicionar ao carrinho</button><button class="btn" data-a="skip" style="flex:1">Comprar em outro mercado</button></div>';
  }
  return '<div class="grid cols2">'+left+'<div>'+right+'</div></div>';
}
function vCarrinho(){
  var items=S.forceEmpty?[]:S.cart;
  if(!items.length)return '<div class="card empty">'+I.cart+'<h3>Seu carrinho está vazio</h3><p>Escaneie um produto para comparar o preço e adicionar aqui.</p><a class="btn primary" href="#escanear" style="display:inline-grid;place-items:center;text-decoration:none">Escanear produto</a></div>';
  var total=0,save=0;
  var h=items.map(function(it,i){var p=pid(it.id),mn=minOf(p);total+=it.price*it.qty;var s=(it.price-mn.v)*it.qty;if(s>0.004)save+=s;
    return '<div class="item"><div><b>'+p.name+'</b><div class="note">'+mname(it.m)+' · '+(s>0.004?'no '+mname(mn.m)+' custou '+money(mn.v):'melhor preço do seu histórico')+'</div></div><div class="row" style="justify-content:flex-end"><span class="num"><b>'+money(it.price*it.qty)+'</b></span><button class="iconbtn" data-a="rm" data-i="'+i+'" aria-label="Remover '+p.name+'">✕</button></div></div>'}).join("");
  return '<div class="grid two"><div class="card"><h2>Itens ('+items.length+')</h2><div class="list">'+h+'</div></div><div class="card"><p class="sub">Total estimado</p><div class="kpi"><div class="v num" style="font-family:\'Barlow Condensed\',\'Arial Narrow\',sans-serif;font-size:44px;font-weight:700">'+money(total)+'</div></div>'+
  (save>0.004?'<div class="verdict good" role="status">'+I.ok+'<div>Comprando cada item no mercado mais barato do seu histórico você economizaria '+money(save)+'.</div></div>':'<div class="verdict good" role="status">'+I.ok+'<div>Todos os itens estão no melhor preço do seu histórico.</div></div>')+
  '<div class="row" style="margin-top:12px"><button class="btn" data-a="clear">Limpar carrinho</button></div></div></div>';
}
function keyState(v){
  var d=v.replace(/\D/g,"");
  if(!d)return "";
  if(d.length<44)return '<p class="note" role="status">'+d.length+' de 44 dígitos</p>';
  if(d.length>44)return '<p class="note" style="color:var(--bad)" role="status">A chave tem 44 dígitos. Você digitou '+d.length+'.</p>';
  var uf=d.slice(0,2);
  if(uf==="33")return '<div class="verdict good" role="status">'+I.ok+'<div>Estado identificado: Rio de Janeiro. Leitura automática disponível.</div></div><button class="btn primary" data-a="keyok" style="margin-top:10px">Importar nota</button>';
  return '<div class="verdict bad" role="status">'+I.alert+'<div>Esse estado (código '+uf+') ainda não tem leitor automático. Importe o XML ou o PDF da nota, ou digite os itens.</div></div>';
}
function vNotas(){
  var list=S.notes.length?S.notes.map(function(n){
    return '<div class="item"><div><b>'+n.store+'</b><div class="note">'+n.date+' · '+n.n+' itens</div>'+(n.st==="pendente"?'<div class="note" style="color:var(--bad)">Leitura automática indisponível no momento. Guardamos a nota e tentamos de novo.</div>':'')+'</div><div style="text-align:right"><b class="num">'+money(n.total)+'</b><div>'+(n.st==="pendente"?'<button class="btn sm" data-a="retryNote" data-id="'+n.id+'">Reprocessar</button>':'<span class="pill good">'+'lida</span>')+'</div></div></div>'}).join(""):'<div class="empty">'+I.doc+'<h3>Nenhuma nota ainda</h3><p>Importe sua primeira nota para começar a comparar preços.</p></div>';
  return '<div class="card"><h2>Importar nota fiscal (NFC-e)</h2><p class="sub">Todas as opções abaixo são gratuitas.</p><div class="opts" style="margin-top:12px">'+
  '<button class="opt" data-a="qr">'+I.scan+'<b>Ler QR Code do cupom</b><span class="note">Aponte a câmera para o QR da nota</span></button>'+
  '<button class="opt" data-a="pasteTxt">'+I.paste+'<b>Colar texto da consulta</b><span class="note">Copie a página da SEFAZ e cole aqui</span></button>'+
  '</div><div class="field"><label for="key">Chave de acesso (44 dígitos)</label><input id="key" inputmode="numeric" autocomplete="off" placeholder="3326 1105 0374 7880 0011 0650 ..."></div><div id="keyState">'+keyState("")+'</div>'+
  '<div class="drop" id="drop" style="margin-top:12px">'+I.file.replace('<svg','<svg width="26" height="26"')+'<div><b>Arraste o XML ou o PDF da nota</b><br><label class="btn sm" style="display:inline-grid;place-items:center;margin-top:8px;cursor:pointer">Escolher arquivo<input type="file" id="file" accept=".xml,.pdf" class="sr"></label></div></div>'+
  '<p class="note" style="margin-top:10px">CPF na nota: importe o XML ou o PDF exportado do app estadual de notas.</p></div>'+
  '<div class="card" style="margin-top:14px"><h2>Suas notas</h2><div class="list">'+list+'</div></div>';
}
function sw(id,label,desc,on){return '<div class="set"><div><b>'+label+'</b><div class="note">'+desc+'</div></div><label class="switch"><input type="checkbox" id="'+id+'" role="switch" aria-label="'+label+'"'+(on?" checked":"")+'><i></i></label></div>'}
function vAjustes(){
  var o=S.ocr,used=o.uses.length,cost=used*UNIT,st;
  if(o.status==="unset")st='<div class="set"><div><b>Leitura avançada de etiqueta</b><div class="note">Opcional e paga por foto. A leitura no aparelho continua gratuita.</div></div><button class="btn sm" data-a="advTry">Conhecer</button></div>';
  else if(o.status==="declined")st='<div class="set"><div><b>Leitura avançada de etiqueta</b><div class="note">Você escolheu não usar. Nada será cobrado.</div></div><button class="btn sm" data-a="advTry">Ativar</button></div>';
  else if(o.status==="cancelled")st='<div class="set"><div><b>Leitura avançada de etiqueta</b><div class="note">Cancelada. Nada será cobrado.</div></div><button class="btn sm" data-a="advTry">Ativar de novo</button></div>';
  else st='<div class="set"><div><b>Leitura avançada de etiqueta</b><div class="note">Ativa · '+money(UNIT)+' por foto (valor de exemplo)</div></div><span class="pill good">ativa</span></div>'+
    sw("auto","Usar automaticamente","Quando a leitura no aparelho tiver baixa confiança",o.auto)+
    '<div class="set"><div><label for="cap"><b>Limite mensal</b></label><div class="note">Aviso ao se aproximar do teto</div></div><select id="cap" style="min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px"><option value="5"'+(o.cap===5?" selected":"")+'>R$ 5</option><option value="10"'+(o.cap===10?" selected":"")+'>R$ 10</option><option value="20"'+(o.cap===20?" selected":"")+'>R$ 20</option><option value="0"'+(o.cap===0?" selected":"")+'>Sem limite</option></select></div>'+
    '<div class="set"><div><b>Uso neste mês</b><div class="note num">'+used+(used===1?' foto':' fotos')+' · '+money(cost)+'</div></div><button class="btn sm danger" data-a="advCancel">Cancelar leitura avançada</button></div>';
  return '<div class="grid cols2"><div class="card"><h2>Créditos e leitura avançada</h2><div class="set"><div><b>Saldo de créditos</b><div class="note">Pré-pago. Sem saldo, o app usa a leitura gratuita.</div></div><b class="num" style="font-size:20px">'+money(S.credits/100)+'</b></div>'+
    '<div class="row" style="margin:10px 0"><button class="btn sm" data-a="topup">Recarregar créditos</button></div>'+st+'</div>'+
   '<div class="card"><h2>Preferências</h2>'+sw("share","Compartilhar preços (opcional)","Envia só produto, preço, mercado e data. Nunca CPF, notas ou histórico.",S.share)+
   '<div class="set"><div><b>Tema</b><div class="note">Claro, escuro ou do sistema</div></div><select id="theme" style="min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px"><option value="auto">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></div></div>'+
   '<div class="card"><h2>Estados de demonstração</h2><p class="sub">Para revisar as telas de carregamento, erro, vazio e sem internet.</p><div class="row" style="margin-top:10px"><button class="btn sm" data-a="demoLoad">Carregando</button><button class="btn sm" data-a="demoErr">Erro</button><button class="btn sm" data-a="demoEmpty">Carrinho vazio</button><button class="btn sm" data-a="demoOff">Sem internet</button></div></div></div>';
}

/* ---------- render ---------- */
function render(){
  $("#side").innerHTML='<div class="brand"><i></i>Gôndola</div>'+navHtml()+'<a class="nav" href="#ajustes"'+(S.view==="ajustes"?' aria-current="page"':"")+'>'+I.gear+'<span>Configurações</span></a>';
  $("#bottom").innerHTML=navHtml();
  var body={inicio:vInicio,escanear:vEscanear,carrinho:vCarrinho,notas:vNotas,ajustes:vAjustes}[S.view]();
  $("#main").innerHTML='<div class="top"><h1>'+TITLES[S.view]+'</h1><a class="iconbtn" href="#ajustes" aria-label="Configurações" style="color:inherit">'+I.gear.replace('<svg','<svg width="20" height="20"')+'</a><button class="iconbtn" data-a="theme" aria-label="Alternar tema claro e escuro">'+I.moon+'</button></div>'+
   (S.offline?'<div class="banner" role="status">'+I.off+'<span>Sem internet. Mostrando seu histórico guardado no aparelho.</span></div>':"")+body;
  var th=$("#theme");if(th)th.value=load("theme")||"auto";
  drawChart();
}
function drawCross(){
  var G=S.geo,i=S.chartIdx,el=$("#cross");if(!el)return;
  el.innerHTML='<line x1="'+G.X(i)+'" x2="'+G.X(i)+'" y1="'+G.t+'" y2="'+(G.H-G.b)+'" stroke="var(--ink2)" stroke-dasharray="3 3"/>'+G.keys.map(function(k){return '<circle cx="'+G.X(i)+'" cy="'+G.Y(HIST[k][i])+'" r="5" fill="'+G.col[k]+'" stroke="var(--surface)" stroke-width="2"/>'}).join("");
  $("#tip").innerHTML=tipHtml();
}
function drawChart(){
  var box=$("#chartBox");if(!box)return;
  var W=Math.max(300,Math.floor(box.clientWidth));
  box.innerHTML=lineChartSvg(W)+'<div class="tip" id="tip"></div>';
  drawCross();
  var svg=$("#lc"),hit=$("#lcHit"),G=S.geo;
  function at(e){var rc=svg.getBoundingClientRect(),px=(e.clientX-rc.left)*(G.W/rc.width),i=Math.round((px-G.l)/((G.W-G.l-G.r)/5));i=Math.max(0,Math.min(5,i));if(i!==S.chartIdx){S.chartIdx=i;drawCross()}}
  hit.addEventListener("pointermove",at);hit.addEventListener("pointerdown",at);
  svg.addEventListener("keydown",function(e){if(e.key==="ArrowRight"){S.chartIdx=Math.min(5,S.chartIdx+1);drawCross();e.preventDefault()}if(e.key==="ArrowLeft"){S.chartIdx=Math.max(0,S.chartIdx-1);drawCross();e.preventDefault()}});
}
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(drawChart,150)});

/* ---------- ações ---------- */
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on")},2600)}
function dlg(html){var d=$("#dlg");d.innerHTML=html;if(!d.open)d.showModal()}
function closeDlg(){var d=$("#dlg");if(d.open)d.close()}
function advModal(){
  dlg('<h2 id="dlgTitle">A leitura avançada tem custo</h2><p>Cada foto lida custa <b>'+money(UNIT)+'</b> (valor de exemplo), descontado dos seus créditos pré-pagos. A leitura no aparelho continua gratuita.</p><p class="note">Você pode cancelar quando quiser em Configurações. Esta mensagem aparece uma única vez.</p><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="advNo">Agora não</button><button class="btn primary" data-a="advYes" autofocus>Aceitar e continuar</button></div>');
}
function readValue(p,how){var v=(p.pr[S.here][0]).toFixed(2).replace(".",",");S.read={v:v,how:how};S.shelf=v}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,p=S.sel?pid(S.sel):null;
  if(a==="theme"){var cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");var nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;store("theme",nx);return}
  if(a==="tbl"){S.showTable=!S.showTable;render();return}
  if(a==="retry"){S.error=false;S.loading=true;render();setTimeout(function(){S.loading=false;render()},700);return}
  if(a==="pick"){S.sel=+b.dataset.id;S.shelf="";S.read=null;render();return}
  if(a==="readA"&&p){toast("Lendo a etiqueta no aparelho...");setTimeout(function(){readValue(p,"leitura no aparelho");render()},600);return}
  if(a==="advTry"){if(S.ocr.status==="unset"||S.ocr.status==="declined"||S.ocr.status==="cancelled")advModal();return}
  if(a==="advYes"){S.ocr.status="accepted";closeDlg();toast("Leitura avançada ativada");render();return}
  if(a==="advNo"){S.ocr.status="declined";closeDlg();toast("Tudo certo, nada será cobrado");render();return}
  if(a==="advRead"&&p){
    var cost=Math.round(UNIT*100);
    if(S.credits<cost){toast("Sem saldo. Usando a leitura no aparelho, sem cobrança.");readValue(p,"leitura no aparelho");render();return}
    S.credits-=cost;S.ocr.uses.push(1);toast("Foto lida. "+money(UNIT)+" debitados dos créditos.");readValue(p,"leitura avançada");render();return}
  if(a==="advCancel"){dlg('<h2 id="dlgTitle">Cancelar leitura avançada?</h2><p>Nada mais será cobrado. O histórico de uso continua guardado.</p><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="closeD">Manter</button><button class="btn danger" data-a="advCancelOk">Cancelar leitura avançada</button></div>');return}
  if(a==="advCancelOk"){S.ocr.status="cancelled";closeDlg();toast("Leitura avançada cancelada");render();return}
  if(a==="closeD"){closeDlg();return}
  if(a==="topup"){toast("No teste os créditos são concedidos manualmente.");return}
  if(a==="add"&&p){var v=parseFloat(String(S.shelf).replace(",","."));if(!isFinite(v)||v<=0){toast("Informe o preço da prateleira.");var s=$("#shelf");if(s)s.focus();return}
    S.cart.push({id:p.id,price:v,qty:1,m:S.here});S.forceEmpty=false;S.shelf="";S.read=null;toast(p.name+" adicionado ao carrinho");render();return}
  if(a==="skip"&&p){toast("Anotado: comprar em "+mname(minOf(p).m));return}
  if(a==="rm"){S.cart.splice(+b.dataset.i,1);render();return}
  if(a==="clear"){S.cart=[];render();return}
  if(a==="qr"){toast("No protótipo a câmera é simulada. No app, o QR da nota é lido aqui.");return}
  if(a==="pasteTxt"){toast("No app, cole o texto da página de consulta da SEFAZ.");return}
  if(a==="keyok"){toast("Nota importada (exemplo).");return}
  if(a==="retryNote"){S.notes.forEach(function(n){if(n.id===+b.dataset.id)n.st="lida"});toast("Nota reprocessada com sucesso");render();return}
  if(a==="demoLoad"){S.loading=true;location.hash="#inicio";render();setTimeout(function(){S.loading=false;render()},1500);return}
  if(a==="demoErr"){S.error=true;S.loading=false;location.hash="#inicio";render();return}
  if(a==="demoEmpty"){S.forceEmpty=true;location.hash="#carrinho";return}
  if(a==="demoOff"){S.offline=!S.offline;render();return}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="shelf"){S.shelf=t.value;var p=S.sel?pid(S.sel):null;if(p)$("#vd").innerHTML=verdict(p,t.value)}
  if(t.id==="key"){$("#keyState").innerHTML=keyState(t.value)}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="here"){S.here=t.value}
  if(t.id==="auto"){S.ocr.auto=t.checked}
  if(t.id==="cap"){S.ocr.cap=+t.value;toast("Limite mensal atualizado")}
  if(t.id==="share"){S.share=t.checked;toast(t.checked?"Compartilhamento ativado":"Compartilhamento desativado")}
  if(t.id==="theme"){var v=t.value;if(v==="auto"){delete document.documentElement.dataset.theme;store("theme","auto")}else{document.documentElement.dataset.theme=v;store("theme",v)}}
  if(t.id==="file"&&t.files[0]){toast("Arquivo recebido: "+t.files[0].name+" (exemplo, nada foi enviado)")}
});
document.addEventListener("dragover",function(e){var d=e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",function(e){var d=e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",function(e){var d=e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");var f=e.dataTransfer.files[0];if(f)toast("Arquivo recebido: "+f.name+" (exemplo, nada foi enviado)")}});
window.addEventListener("online",function(){S.offline=false;render()});
window.addEventListener("offline",function(){S.offline=true;render()});
window.addEventListener("hashchange",route);

/* ---------- início ---------- */
var th=load("theme");if(th==="light"||th==="dark")document.documentElement.dataset.theme=th;
route();
setTimeout(function(){S.loading=false;if(S.view==="inicio")render()},900);
})();
</script>
</body>
</html>
